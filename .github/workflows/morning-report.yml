name: MilkLab Sales Logger Automation
on:
  schedule:
    - cron: "0 0 * * *" # รันทุกเที่ยงคืน UTC (หรือ 7 โมงเช้าไทย)
  workflow_dispatch:     # อนุญาตให้คุณกดรันด้วยมือเองได้ด้วย
jobs:
  run-logger:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: pip install gspread python-dotenv requests
      - name: Run Sales Logger
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GOOGLE_SHEETS_ID: ${{ secrets.GOOGLE_SHEETS_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON_B64: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON_B64 }}
        run: |
          # สร้างไฟล์ JSON จาก Secret ที่เก็บไว้
          echo $GOOGLE_SERVICE_ACCOUNT_JSON_B64 | base64 -d > credentials.json
          # รันคำสั่งทดสอบ (คุณเปลี่ยนค่าตรงนี้ได้ตามต้องการ)
          python3 sales_logger.py --menu "Auto-Report" --qty 1 --price 0