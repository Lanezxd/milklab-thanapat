name: BoardGame Haven Morning Report Automation
on:
  schedule:
    - cron: "0 0 * * *" # รันทุกเที่ยงคืน UTC (หรือ 7 โมงเช้าไทย)
  workflow_dispatch:     # อนุญาตให้กดรันด้วยมือเพื่อทดสอบได้

jobs:
  run-logger:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      
      # ติดตั้งแพ็กเกจที่จำเป็น
      - run: pip install gspread python-dotenv requests
      
      - name: Run BoardGame Haven Morning Report
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GOOGLE_SHEETS_ID: ${{ secrets.GOOGLE_SHEETS_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON_B64: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON_B64 }}
        run: |
          cat << 'EOF' > run_report.py
          import sales_logger
          import re

          try:
              # 1. ดึงรายงานสรุปยอดของเมื่อวาน
              report = sales_logger.get_yesterday_total_sales()
              print(f"Fetching Report: {report}")
              
              # 2. ยิงแจ้งเตือนสรุปยอดเข้า Telegram
              sales_logger.send_notification(f"🎲 [BoardGame Haven Morning Report]\n{report}")
              print("Telegram Notification Sent Successfully!")
              
              # 3. สกัดตัวเลขจำนวนรายการและยอดเงิน (รองรับทั้งแบบมี/ไม่มี comma)
              match_qty = re.search(r"(?:ให้บริการไปทั้งหมด|ขายได้รวม)\s*(\d+)", report)
              match_rev = re.search(r"ยอดเงินสุทธิ\s*([\d,]+\.?\d*)", report)
              
              if match_qty and match_rev:
                  actual_qty = int(match_qty.group(1))
                  rev_str = match_rev.group(1).replace(",", "")
                  actual_revenue = float(rev_str)
                  unit_price = actual_revenue / actual_qty if actual_qty > 0 else 0.0
              else:
                  actual_qty = 0
                  unit_price = 0.0
              
              # 4. บันทึกแถวสรุปยอดประจำวันลง Google Sheets
              if actual_qty > 0:
                  sales_logger.append_to_sheet(
                      item="🎲 [Summary Log] สรุปยอดบริการและเช่าบอร์ดเกมประจำวัน", 
                      qty=actual_qty, 
                      price=unit_price
                  )
                  print(f"Successfully appended Row: Qty={actual_qty}, Total={actual_qty * unit_price}")
              else:
                  print("No sales recorded yesterday, skipped sheet append.")
              
          except Exception as e:
              print(f"Error occurred: {e}")
          EOF

          # รันสคริปต์รายงาน
          python3 run_report.py