name: MilkLab Sales Logger Automation
on:
  schedule:
    - cron: "0 0 * * *" # รันทุกเที่ยงคืน UTC (หรือ 7 โมงเช้าไทย)
  workflow_dispatch:     # อนุญาตให้คุณกดรันด้วยมือเองได้ด้วย

jobs:
  run-logger:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      
      # 🌟 ติดตั้ง gspread และ requests สำหรับต่อฐานข้อมูลและยิง API (เสถียรและเร็วที่สุด)
      - run: pip install gspread python-dotenv requests
      
      - name: Run Sales Logger Morning Report
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GOOGLE_SHEETS_ID: ${{ secrets.GOOGLE_SHEETS_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON_B64: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON_B64 }}
        run: |
          # 🚀 อ่านข้อมูลสรุปจริง ➡️ ยิงเข้า Telegram ➡️ บันทึกประวัติลง Google Sheets ครบจบในทีเดียว
          python3 -c "
          import sales_logger
          try:
              # 1. ดึงรายงานตัวเลขคำนวณจริงของเมื่อวานจาก Google Sheets
              report = sales_logger.get_yesterday_total_sales()
              print(f'Fetching Report: {report}')
              
              # 2. ส่งแจ้งเตือนข้อความสรุปนั้นเข้าสู่ Telegram
              sales_logger.send_notification(f'🔔 [Morning Report]\n{report}')
              print('Telegram Notification Sent Successfully!')
              
              # 3. บันทึกข้อความสรุปจริงนี้เพิ่มกลับลงไปใน Google Sheets อีก 1 แถวเพื่อเก็บประวัติ
              # ตั้งค่า qty=1 และ price=0.0 เพื่อให้ตัวเลขรวมในระบบบัญชีวันถัดไปไม่คลาดเคลื่อน
              sales_logger.append_to_sheet(menu=f'🔔 [Morning Report] {report}', qty=1, price=0.0)
              print('Summary Row Appended to Google Sheets Successfully!')
              
          except Exception as e:
              print(f'Error occurred: {e}')
          "