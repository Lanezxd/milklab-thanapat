name: MilkLab Sales Logger Automation
on:
  schedule:
    - cron: "0 0 * * *" # รันทุกเที่ยงคืน UTC (หรือ 7 โมงเช้าไทย)
  workflow_dispatch:     # อนุญาตให้คุณกดรันด้วยมือเองได้ด้วย

jobs:
  run-logger:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      
      # 🌟 ติดตั้ง gspread และ requests สำหรับต่อฐานข้อมูลและยิง API (เสถียรและเร็วที่สุด)
      - run: pip install gspread python-dotenv requests
      
      - name: Run Sales Logger Morning Report
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GOOGLE_SHEETS_ID: ${{ secrets.GOOGLE_SHEETS_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON_B64: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON_B64 }}
        run: |
          # 🚀 ดึงสถิติจริง ➡️ ส่งเข้า Telegram ➡️ แยกแกะตัวเลขดิบหยอดลงแต่ละคอลัมน์ของตารางชีต
          python3 -c "
          import sales_logger
          import re
          try:
              # 1. ดึงรายงานแบบข้อความจริงของเมื่อวาน
              report = sales_logger.get_yesterday_total_sales()
              print(f'Fetching Report: {report}')
              
              # 2. ยิงแจ้งเตือนข้อความรายงานตัวเลขเข้าห้องแชท Telegram
              sales_logger.send_notification(f'🔔 [Morning Report]\n{report}')
              print('Telegram Notification Sent Successfully!')
              
              # 3. ใช้ Regex ถอดรหัสแกะตัวเลขดิบออกจากสายอักขระเพื่อหยอดแยกคอลัมน์
              # ข้อความรูปแบบ: สรุปยอดขายเมื่อวาน (YYYY-MM-DD) ขายได้รวม X ชิ้น ยอดเงินสุทธิ Y บาท
              numbers = [float(s) for s in re.findall(r'-?\d+\.?\d*', report)]
              
