name: MilkLab Sales Logger Automation
on:
  schedule:
    - cron: "0 0 * * *" # รันทุกเที่ยงคืน UTC (หรือ 7 โมงเช้าไทย)
  workflow_dispatch:     # อนุญาตให้คุณกดรันด้วยมือเองได้ด้วย

jobs:
  run-logger:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      
      # 🌟 เพิ่ม google-genai ในการติดตั้ง เพื่อให้สคริปต์หน้าบ้านดึงโมดูล AI มารัน Agent Router ได้
      - run: pip install gspread python-dotenv requests google-genai
      
      - name: Run Sales Logger
        env:
          GEMINI_API_KEY: ${{ secrets.GOOGLE_API_KEY }}  # 🔑 เพิ่มคีย์เอไอเพื่อให้หน้าบ้านใช้งานได้
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GOOGLE_SHEETS_ID: ${{ secrets.GOOGLE_SHEETS_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON_B64: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON_B64 }}
        run: |
          # 📁 สร้างโฟลเดอร์และไฟล์ JSON จาก Secret ให้ตรงตาม Path ที่สคริปต์ใช้ดึงข้อมูลจริง
          mkdir -p credentials
          echo "$GOOGLE_SERVICE_ACCOUNT_JSON_B64" | base64 -d > credentials/milk-lab-0df755c40bc9.json
          
          # 🚀 เปลี่ยนจากการป้อนคำสั่งทื่อๆ เป็นการสั่งให้ Agent สรุปยอดขายจริงย้อนหลัง 1 วันจากตารางกูเกิลชีท
          python3 agent_harness.py --cmd "ขอสรุปยอดขายเมื่อวานหน่อย"